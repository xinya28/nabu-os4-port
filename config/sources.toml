# 源机型登记表 —— 澎湃OS 4（Android 17）平板
#
# 代号是**权威的**：来自 XiaomiFirmwareUpdater 的设备索引，和 tracker 里的
# `codename` 字段一一对应，`tools/findrom.js --device <代号>` 就是用这个键查固件。
# 版本号/体积是 2026-11-27 从 tracker 抓到的快照，只作参考——真正构建时由
# findrom 现取，不要把它当成"固定输入"。
#
# 这里依然**不含下载地址**。原因见 docs/FIRMWARE.md：
#   1) 直链随版本变化，写死必然过期；
#   2) 同一个链接在不同镜像域名上可用性不同（实测 bigota 403、cdnorg 206）；
#   3) 固件是厂商二进制，不该进公开仓库。
#
# 选源机型时优先看：
#   ① 屏幕分辨率/DPI 是否接近 nabu 的 2560x1600@320（越接近，overlay 越少）
#   ② tablet 框架完整度（OS4 首批机型最全）
#   ③ 有没有 tablet 专属配件框架（笔/键盘盖），对笔相关组件有参考价值

[[source]]
codename = "yupei"
model    = "Xiaomi Pad 8 / Pad 9（中国）"
os4      = "OS4.0.12.0.XPZCNXM"
