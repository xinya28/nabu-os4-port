name: lint

# 不碰 ROM、不碰真机的快速门禁：语法、配置键、工具语义、erofs 往返。
# 目的是让"脚本本身写错"在 2 分钟内暴露，而不是在 350 分钟的 ROM 构建末尾。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          # 同 build-rom：microsoft 源偶发 403，会导致 apt-get update 整体失败
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list \
                     /etc/apt/sources.list.d/azure*.list 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3 \
            || echo "::warning::apt-get update 有源失败，继续用已有索引"
          sudo apt-get install -y --no-install-recommends \
            erofs-utils android-sdk-libsparse-utils zstd shellcheck python3 file xxd \
            python3-yaml

      - name: workflow 语法
        run: |
          # 这条检查是有来由的：build-rom.yml 曾经因为 --notes 里一行顶格续行
          # 把 run: | 的块标量提前截断，GitHub 直接判"无效工作流"——那种失败
          # 没有 job、没有日志，只能靠 dispatch 被 422 才发现。
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  yaml.safe_load(open(f, encoding="utf-8"))
                  print(f"ok   {f}")
              except Exception as e:
                  bad += 1
                  print(f"FAIL {f}: {e}")
          sys.exit(1 if bad else 0)
          PY

      - name: shellcheck
        run: |
          shellcheck --version
          # SC1091: source 的文件在运行期才存在；
          # SC2086 等保持默认开启——流水线里未加引号的变量真会出问题。
          shellcheck -S warning -e SC1091 \
            scripts/*.sh kernel/scripts/*.sh

      - name: python 语法
        run: |
          python3 -m py_compile tools/*.py
          node --check tools/repack_boot.js
          node --check tools/findrom.js

      - name: 自检
        run: bash scripts/selftest.sh

      - name: 配置可解析
        run: |
          set -euo pipefail
          for f in config/target/nabu.toml config/sources.toml config/profiles.toml \
                   port/manifest.toml kernel/source.toml; do
            python3 -c "import tomllib,sys; tomllib.load(open(sys.argv[1],'rb'))" "$f"
            echo "ok $f"
          done
