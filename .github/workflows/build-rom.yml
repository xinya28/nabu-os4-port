name: build-rom

# 完整链路：取源固件 → 解包 → 精简 → 移植注入 → 内核 → 打包 → 自检。
#
# 两种给固件的方式，二选一：
#   1. rom_url 直接给直链（推荐用于固定复现：把 zip 放到你自己的 Release 里再填资产链接）
#   2. rom_url 留空 → 用 source(代号) 去 XiaomiFirmwareUpdater 的索引里解析最新 OS4 包，
#      并自动挑一个能通的镜像域名（实测 bigota/hugeota 会 403，cdnorg 正常）
#
# 产物按 1.8 GiB 自动切分，避免撞 artifact 的单文件上限。

on:
  workflow_dispatch:
    inputs:
      source:
        description: "源机型代号（rom_url 为空时用它解析固件；也是报告里的谱系）"
        required: true
        default: yupei
        type: choice
        options:
          - yupei      # Xiaomi Pad 8 / Pad 9（中国）
          - piano      # Xiaomi Pad 8 Pro
          - uke        # Xiaomi Pad 7
          - muyu       # Xiaomi Pad 7 Pro
          - jinghu     # Xiaomi Pad 7 Ultra
          - violin     # Xiaomi Pad 7S Pro 12.5
          - yili       # REDMI K Pad 2
          - yingtian   # Xiaomi Pad 9 Pro Max
      rom_url:
        description: "固件直链（留空 = 按 source 自动解析）"
        required: false
        default: ""
        type: string
      rom_sha256:
        description: "固件 sha256（留空 = 不校验，只记录）"
        required: false
        default: ""
        type: string
      debloat_profile:
        description: "精简档位"
        required: true
        default: minimal
        type: choice
        options: [none, minimal, balanced, aggressive]
      parts_only:
        description: "只解这些分区（省 3-4 GB 磁盘）"
        required: true
        default: "system,product,system_ext,boot"
        type: string
      build_kernel:
        description: "同时构建内核（关闭则只出 system 侧）"
        required: true
        default: true
        type: boolean
      strict:
        description: "移植层校验失败即中止（首次试移植建议关闭）"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "非空则把产物发到 Release（例 v0.1-uke）"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: rom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: rom (${{ inputs.source }} / ${{ inputs.debloat_profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /opt/hostedtoolcache/go /opt/hostedtoolcache/node \
                      "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          sudo apt-get clean
          df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            erofs-utils android-sdk-libsparse-utils zstd zip unzip \
            python3 curl file xxd coreutils nodejs \
            bc bison flex libssl-dev libelf-dev libncurses-dev cpio \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu git xz-utils

      - name: 解析固件地址
        id: resolve
        env:
          SRC: ${{ inputs.source }}
          ROM_URL: ${{ inputs.rom_url }}
        run: |
          set -euo pipefail
          url="${ROM_URL:-}"
          if [ -z "$url" ]; then
            # findrom 会打印"能通的那个镜像"的完整 URL（stderr 上是候选镜像的探测结果）
            url="$(node tools/findrom.js --device "$SRC" --check | tail -1)"
          fi
          [ -n "$url" ] || { echo "解析不到固件地址" >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### 固件"
            echo
            echo '```'
            echo "$url"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 00 preflight
        run: bash scripts/00_preflight.sh --install --min-free-gb 30

      - name: 01 fetch
        env:
          URL: ${{ steps.resolve.outputs.url }}
          ROM_SHA: ${{ inputs.rom_sha256 }}
          SRC: ${{ inputs.source }}
        run: |
          set -euo pipefail
          args=(--url "$URL" --source "$SRC")
          [ -n "${ROM_SHA:-}" ] && args+=(--sha256 "$ROM_SHA")
          bash scripts/01_fetch.sh "${args[@]}"

      - name: 02 unpack
        env:
          ONLY: ${{ inputs.parts_only }}
        run: |
          set -euo pipefail
          rom=""
          for f in work/rom/*; do
            [ -f "$f" ] || continue
            case "$f" in *.json) continue ;; esac
            if [ -z "$rom" ] || [ "$f" -nt "$rom" ]; then rom="$f"; fi
          done
          [ -n "$rom" ] || { echo "work/rom 里没有固件，01 失败了吗？" >&2; exit 1; }
          echo "input: $rom"
          args=(--input "$rom")
          [ -n "${ONLY:-}" ] && args+=(--only "$ONLY")
          bash scripts/02_unpack.sh "${args[@]}"

      - name: 03 debloat
        run: bash scripts/03_debloat.sh --profile "${{ inputs.debloat_profile }}"

      - name: 04 port
        run: |
          set -euo pipefail
          args=()
          [ "${{ inputs.strict }}" = "true" ] && args+=(--strict)
          bash scripts/04_port.sh "${args[@]}"

      - name: 05 kernel
        if: ${{ inputs.build_kernel }}
        run: bash scripts/05_kernel.sh --download-llvm --jobs "$(nproc)"

      - name: 06 package
        run: bash scripts/06_package.sh --version "${{ inputs.source }}-${{ github.run_number }}"

      - name: 07 verify
        run: bash scripts/07_verify.sh

      - name: 摘要
        if: always()
        run: |
          {
            echo "## nabu-os4-port 构建结果"
            echo
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 源机型 | ${{ inputs.source }} |"
            echo "| 精简档位 | ${{ inputs.debloat_profile }} |"
            echo "| 内核 | ${{ inputs.build_kernel }} |"
            echo "| 固件 | ${{ steps.resolve.outputs.url }} |"
            echo "| run | #${{ github.run_number }} |"
            echo
            for f in out/ported/port-report.md work/debloated/debloat-report.txt out/verify-report.txt; do
              [ -f "$f" ] || continue
              echo "<details><summary>$f</summary>"
              echo
              echo '```'
              head -100 "$f"
              echo '```'
              echo
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nabu-os4-${{ inputs.source }}-${{ github.run_number }}
          path: |
            out/package/*
            out/ported/port-report.md
            out/ported/port-manifest.json
            out/verify-report.txt
            out/pipeline-summary.txt
            out/*.zip
          if-no-files-found: warn
          retention-days: 14

      - name: 发布到 Release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          SRC: ${{ inputs.source }}
          PROFILE: ${{ inputs.debloat_profile }}
          RUNNO: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # 说明单独写文件：--notes 里多行文本会把 run: | 的块标量截断
          # （缩进小于块缩进的行会结束标量，整个 workflow 直接解析失败）
          notes="$(mktemp)"
          {
            echo "nabu-os4-port $TAG"
            echo
            echo "源机型: $SRC    精简档位: $PROFILE    run: #$RUNNO"
            echo
            echo "仅镜像级自检通过，未在真机验证。刷写前请读包内 README-FLASH.txt。"
          } > "$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/package/* --clobber
          else
            gh release create "$TAG" out/package/* \
              --title "nabu-os4-port $TAG" \
              --notes-file "$notes"
          fi
